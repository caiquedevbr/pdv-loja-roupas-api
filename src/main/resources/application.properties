spring.application.name=pdv-loja
# Perfil padrao para o ambiente local. Producao deve informar explicitamente o perfil prod.
spring.profiles.default=dev

# Configuração do H2 Database (banco em memória)


spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Habilitar o console do H2 (opcional)
spring.h2.console.enabled=true


# Mostrar o SQL no console
spring.jpa.show-sql=true


# Criar ou atualizar o banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=update

# Limita o tamanho das páginas para evitar consultas excessivas.
spring.data.web.pageable.max-page-size=100

# Recursos avançados da V2. Em produção, informe explicitamente as origens confiáveis.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.api-key.ttl-hours=24
app.rate-limit.requests-per-minute=60
app.idempotency.ttl-hours=24
